name: Confirmed CRM lead deletion checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/p0-13-confirmed-lead-delete-20261109]

permissions:
  contents: read

jobs:
  delete-safety:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only-key
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: fake-build-secret-never-used
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: RLS zero-row mutation regression tests
        run: node --experimental-strip-types --test tests/lead-delete-guard.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Compile Next.js
        run: npm run build
