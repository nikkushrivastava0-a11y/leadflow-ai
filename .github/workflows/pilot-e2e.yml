name: Synthetic pilot browser E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: leadflow_jwt_browser
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: leadflow_jwt_browser
      LEADFLOW_SYNTHETIC_ONLY: YES
      LEADFLOW_NEXT_FLOW: YES
      LEADFLOW_PUBLIC_NEXT_FLOW: YES
      LEADFLOW_FEATURE_FLOW: YES
      LEADFLOW_PLAYWRIGHT_FLOW: YES
      LEADFLOW_PRODUCT_FLOW: YES
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pinned official Auth and PostgREST fixture
        run: |
          mkdir -p "$RUNNER_TEMP/leadflow/bin"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/leadflow/auth.tar.xz" https://github.com/supabase/auth/releases/download/v2.197.0/auth-v2.197.0-amd64.tar.xz
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/leadflow/rest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz
          printf '%s  %s\n' b5c2991d1df760c9b099c1c2395a94bd1c2f83ed58901934921997179dc9f7ea "$RUNNER_TEMP/leadflow/auth.tar.xz" | sha256sum --check
          printf '%s  %s\n' 5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95 "$RUNNER_TEMP/leadflow/rest.tar.xz" | sha256sum --check
          tar --extract --xz --no-same-owner --file "$RUNNER_TEMP/leadflow/auth.tar.xz" --directory "$RUNNER_TEMP/leadflow/bin" auth
          tar --extract --xz --no-same-owner --file "$RUNNER_TEMP/leadflow/rest.tar.xz" --directory "$RUNNER_TEMP/leadflow/bin" postgrest
      - name: Official services, real app and Chromium journey
        run: LEADFLOW_AUTH_BIN="$RUNNER_TEMP/leadflow/bin/auth" LEADFLOW_POSTGREST_BIN="$RUNNER_TEMP/leadflow/bin/postgrest" node security/tests/local-auth-api.mjs
      - name: Synthetic UI screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-pilot-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 1
