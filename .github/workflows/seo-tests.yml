name: Marketing SEO metadata smoke tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [seo/p2-04-indexable-marketing-only-20261109]
permissions:
  contents: read
jobs:
  canonical-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify public canonical origin
        run: node --experimental-strip-types --test tests/site-origin.test.ts
