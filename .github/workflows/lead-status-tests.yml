name: Lead status unit tests
on:
  pull_request:
    paths:
      - "src/lib/lead-status.ts"
      - "src/lib/actions.ts"
      - "tests/lead-status.test.mjs"
      - ".github/workflows/lead-status-tests.yml"
  push:
    branches:
      - "fix/p3-03a-lead-status-validation-20261109"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --experimental-strip-types --test tests/lead-status.test.mjs
