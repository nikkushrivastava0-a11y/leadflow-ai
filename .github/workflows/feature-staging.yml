name: Feature staging-copy migrations and regressions
on:
  pull_request:
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: leadflow_feature_staging
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: leadflow_feature_staging
      LEADFLOW_SYNTHETIC_ONLY: YES
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node security/tests/features-staging.mjs
      - run: node --test tests/*.test.ts tests/*.test.mjs security/tests/*.test.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
