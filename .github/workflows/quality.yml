name: Pull request quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [ci/p0-12-pr-quality-gates-20261109]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Dummy build-only placeholders. Never grant DB or payment access to CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only-key
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: fake-build-secret-never-used
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Run unit tests when present
        run: npm run test:unit --if-present
      - name: Production compilation (no real service credentials)
        run: npm run build
