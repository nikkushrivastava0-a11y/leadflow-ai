name: Public enquiry validation checks

on:
  pull_request:
    branches: [main, fix/p0-09-visible-form-errors-20261109]
  push:
    branches: [fix/p0-07-public-lead-validation-20261109]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Unit tests (synthetic inputs only)
        run: node --experimental-strip-types --test tests/public-leads.test.ts
