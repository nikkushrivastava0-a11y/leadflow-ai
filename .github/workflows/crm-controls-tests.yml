name: CRM search and pagination checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/p1-07-crm-table-controls-20261109]

permissions:
  contents: read

jobs:
  crm-controls:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only-key
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: fake-build-secret-never-used
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Search and sorting regression tests (no API calls)
        run: node --experimental-strip-types --test tests/lead-table-controls.test.mjs
      - name: Exact dependency install
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
