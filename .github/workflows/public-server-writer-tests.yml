name: Protected public submission draft checks

on:
  pull_request:
    branches: [main, security/p0-08-public-form-guard-20261109]
  push:
    branches: [security/p0-05b-server-only-form-write-20261109]

permissions:
  contents: read

jobs:
  server-only-submission:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only-key
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: fake-build-secret-never-used
      # Do not provide SUPABASE_SECRET_KEY. Production secrets must never run in CI.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test secret isolation with synthetic values only
        run: node --experimental-strip-types --test tests/public-submission-secret.test.mjs
      - name: Test public Redis guard with mocked network
        run: node --experimental-strip-types --test tests/public-lead-guard.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Compile Next.js preview
        run: npm run build
